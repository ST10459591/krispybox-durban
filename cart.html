       class="logo-link">

        <span class="logo-text">

    </a>

<h1 class="title">
    Your Cart
</h1>


<!-- CART PRODUCTS -->

<div
    class="products-grid"
    id="cartProducts"
    style="padding:40px;">
</div>


<!-- EMPTY CART -->

<div
    id="emptyCart"
    style="
        display:none;
        text-align:center;
        padding:50px;
    ">

    <h2>
        Your cart is empty
    </h2>

    <p>
        Add some delicious items
        from our menu!
    </p>

    <a href="menu.html"
       class="btn">

        View Menu

    </a>

</div>


<!-- TOTAL -->

<div
    class="checkout-box"
    id="checkoutBox">

    <h2>

        Total:
        R<span id="cartTotal">
            0.00
        </span>

    </h2>

    <a href="checkout.html"
       class="btn">

        Proceed To Checkout →

    </a>

</div>


<script src="assets/js/cart.js"></script>
