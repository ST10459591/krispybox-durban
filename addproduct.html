<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Product | Krispy Box</title>

    <link rel="stylesheet"
          href="../assets/css/style.css">

</head>

<body>


<div class="form-container">

    <form id="addProductForm">

        <h1>
            Add Product
        </h1>


        <p
            id="successMessage"
            class="success"
            style="display:none;">
        </p>


        <input
            type="text"
            id="name"
            placeholder="Product Name"
            required
        >


        <textarea
            id="description"
            placeholder="Description"
            required></textarea>


        <input
            type="number"
            step="0.01"
            id="price"
            placeholder="Price"
            required
        >


        <input
            type="file"
            id="image"
            accept="image/*"
            required
        >


        <img
            id="imagePreview"
            src=""
            alt="Image Preview"
            style="
                display:none;
                width:100%;
                max-height:200px;
                object-fit:cover;
                margin-bottom:15px;
                border-radius:10px;
            "
        >


        <button type="submit">
            Add Product →
        </button>


        <br><br>


        <a
            href="dashboard.html"
            class="btn">

            ← Back

        </a>

    </form>

</div>


<script src="../assets/js/products.js"></script>

</body>

</html>
