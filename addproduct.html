
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | Krispy Box</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="form-container">
        <form id="addProductForm">
            <h1>Add Product</h1>

            <p id="successMessage" class="success" style="display:none;"></p>

            <input
                type="text"
                id="name"
                placeholder="Product Name"
                required
            >

            <textarea
                id="description"
                placeholder="Description"
                required
            ></textarea>

            <input
                type="number"
                id="price"
                placeholder="Price (R)"
                min="0.01"
                step="0.01"
                required
            >

           
<label for="image">Product Image Path</label>
<input
    type="text"
    id="image"
    placeholder="assets/images/1_wors_roll.jpg"
    required
>


<img
    id="imagePreview"
    src=""
    alt="Product image preview"
    style="display:none; width:150px; height:110px;
    object-fit:cover; margin:10px auto 15px;
    border-radius:10px;"
>


            <button type="submit" id="addProductButton">
                Add Product →
            </button>

            <br><br>

            <a href="dashboard.html" class="btn">← Back</a>
        </form>
    </div>

    <script type="module" src="../assets/js/products.js"></script>
</body>
</html>
