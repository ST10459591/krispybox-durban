<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Krispy Box</title>

    <link rel="stylesheet"
          href="../assets/css/style.css">

</head>

<body>


<div class="form-container">

    <form id="loginForm">

        <h1>
            Admin Login
        </h1>


        <p
            id="loginError"
            style="
                color:red;
                display:none;
                margin-bottom:15px;
                text-align:center;
            ">

            Invalid Login Details

        </p>


        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >


        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >


        <button type="submit">
            Login →
        </button>


        <br><br>


        <a
            href="../index.html"
            class="btn">

            ← Back to Website

        </a>

    </form>

</div>


<script src="../assets/js/login.js"></script>

</body>

</html>
