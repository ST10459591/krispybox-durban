<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | Krispy Box</title>

    <link rel="stylesheet"
          href="assets/css/style.css">

</head>

<body>


<div class="form-container">

    <form id="registerForm">

        <h1>
            Create Account
        </h1>


        <p
            id="registerMessage"
            style="display:none;">
        </p>


        <input
            type="text"
            id="fullname"
            placeholder="Full Name"
            required
        >


        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
        >


        <input
            type="password"
            id="password"
            placeholder="Password"
            minlength="6"
            required
        >


        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            minlength="6"
            required
        >


        <button type="submit">
            Register →
        </button>


        <br><br>


        <a href="login.html">
            Already have an account? Login
        </a>


        <br><br>


        <a href="index.html">
            ← Back to Home
        </a>

    </form>

</div>


<script src="assets/js/register.js"></script>

</body>

</html>
